name: Assemble reviewed V1 continuity

on:
  push:
    branches: ["feature/nostr-layered-v1-20260926"]
    paths:
      - ".github/continuity-review/**"
      - ".github/workflows/assemble-continuity-v1.yml"

permissions:
  contents: read

jobs:
  assemble:
    if: github.repository == 'LicoLand/LicoArc' && github.ref == 'refs/heads/feature/nostr-layered-v1-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
      - name: Validate original source and checksum-bound edits
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 996dc9162401d31a9747f0a98accf3536b53d765 HEAD
          git diff --quiet 996dc9162401d31a9747f0a98accf3536b53d765 HEAD -- . ':(exclude).github/continuity-review/**' ':(exclude).github/workflows/assemble-continuity-v1.yml'
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          encoded = ''.join(Path(f'.github/continuity-review/part-{i:02d}.b64').read_text().strip() for i in range(8))
          assert len(encoded) == 87628
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) == 424892
          assert hashlib.sha256(raw).hexdigest() == 'bc092794ce76755dead902e2202648e007542b52f29f6b21cf126442cea2d2b9'
          patch = json.loads(raw)
          assert patch['format'] == 'licoarc.reviewed-line-edits.v1'
          assert patch['baseCommit'] == '996dc9162401d31a9747f0a98accf3536b53d765'
          assert len(patch['files']) == 114
          prepared, seen = [], set()
          for entry in patch['files']:
              name = entry['path']
              rel = PurePosixPath(name)
              assert not rel.is_absolute() and str(rel) == name
              assert not any(p in ('..', '.', '.git') for p in rel.parts)
              assert name not in seen and not name.startswith('.github/')
              seen.add(name)
              path = Path(name)
              assert not path.is_symlink() and not any(p.is_symlink() for p in path.parents)
              before = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None) == entry['before']
              lines = (before or b'').decode('utf-8').splitlines(keepends=True)
              end = 0
              for i, j, added in entry['edits']:
                  assert isinstance(i, int) and isinstance(j, int) and end <= i <= j <= len(lines)
                  assert isinstance(added, list) and all(isinstance(v, str) for v in added)
                  end = j
              for i, j, added in reversed(entry['edits']):
                  lines[i:j] = added
              after = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == entry['after'], name
              prepared.append((path, after))
          for path, after in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(after)
          print('Applied 114 exact-source edits')
          PY
      - name: Refresh identities and verify unit and definition corpora
        run: |
          set -euo pipefail
          npm run definition:refresh
          npm run verify 2>&1 | tee /tmp/continuity-verify.log
          sha256sum artifacts/v1/licoarc.bundle.json artifacts/v1/nostr-interop.bundle.json > /tmp/continuity-artifacts.sha256
          echo 'a3d12950681077ec836d94c32989b4a332391e781ee4a8f9858610ae90a646a3  artifacts/v1/licoarc.bundle.json' | sha256sum --check
          echo '1a81edaa1427b5e7c70416eb062062e8e5706cb4352eddb9035de6e71959ab62  artifacts/v1/nostr-interop.bundle.json' | sha256sum --check
          npm run definition:refresh
          sha256sum --check /tmp/continuity-artifacts.sha256
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync('package.json'));
          const m = JSON.parse(readFileSync('spec/v1/manifest.json'));
          if (p.version !== '0.1.0' || m.generation !== 1 || m.definitionStatus !== 'PARTIAL' || m.sessionEligible !== false || m.publicationEligible !== false) throw Error('V1 or security requalification boundary changed');
          JS
          git diff --check
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuity-validation
          path: |
            /tmp/continuity-verify.log
            /tmp/continuity-artifacts.sha256
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit verified sources on the same feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=feature/nostr-layered-v1-20260926
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_sha="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: decouple durable communication and live capabilities in V1'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
