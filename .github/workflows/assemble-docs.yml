name: Assemble reviewed documentation
on:
  push:
    branches: ["feature/nostr-layered-v1-20260926"]
    paths: [".github/docs-review/**", ".github/workflows/assemble-docs.yml"]
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'LicoLand/LicoArc' && github.ref == 'refs/heads/feature/nostr-layered-v1-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
      - name: Apply checksum-bound documentation changes
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 802a023cc0e02e78fcb52780311e3236bc75af90 HEAD
          git diff --quiet 802a023cc0e02e78fcb52780311e3236bc75af90 HEAD -- . ':(exclude).github/docs-review/**' ':(exclude).github/workflows/assemble-docs.yml'
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          raw=lzma.decompress(base64.b64decode(''.join(Path(f'.github/docs-review/part-{i:02d}.b64').read_text().strip() for i in range(2)),validate=True))
          assert len(raw)==35517 and hashlib.sha256(raw).hexdigest()=='7ff3789b45ee8a8533848daeac4ed1c64249ca71187220963cc57adb5730f6f3'
          patch=json.loads(raw)
          assert patch['format']=='licoarc.reviewed-doc-edits.v1' and patch['base']=='802a023cc0e02e78fcb52780311e3236bc75af90'
          assert len(patch['files'])==25
          prepared=[];seen=set()
          for e in patch['files']:
              n=e['path'];p=Path(n);r=PurePosixPath(n)
              assert n not in seen and not r.is_absolute() and str(r)==n and not any(x in ('..','.git') for x in r.parts)
              assert not n.startswith('.github/workflows/') and not p.is_symlink() and not any(x.is_symlink() for x in p.parents)
              seen.add(n);before=p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None)==e['before'],n
              assert 'delete' not in e and 'copy' not in e
              lines=(before or b'').decode().splitlines(keepends=True);end=0
              for i,j,added in e['edits']:
                  assert end<=i<=j<=len(lines) and all(isinstance(x,str) for x in added);end=j
              for i,j,added in reversed(e['edits']):lines[i:j]=added
              after=''.join(lines).encode()
              assert hashlib.sha256(after).hexdigest()==e['after'],n
              prepared.append((p,after))
          for p,data in prepared:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          PY
      - name: Check documentation and unchanged protocol artifacts
        run: |
          set -o pipefail
          npm run docs:check
          npm run verify | tee /tmp/docs-definition-check.log
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: docs-definition-check
          path: /tmp/docs-definition-check.log
          retention-days: 7
      - name: Commit checked sources to the same review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=feature/nostr-layered-v1-20260926
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_sha="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: establish single-source catalogue and public reading paths'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
