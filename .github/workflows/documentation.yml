name: Documentation
on:
  push:
    branches: ["nightly", "stable", "release", "feature/nostr-layered-v1-20260926"]
  pull_request:
    branches: ["nightly", "stable", "release"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    name: Single-source documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check documentation catalogue
        run: npm run docs:check
      - name: Resolve pinned renderer
        id: renderer
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          pin=json.loads(Path('docs/renderer.json').read_text())
          assert pin['format']=='licoarc.documentation-renderer.v1'
          assert pin['repository']=='LicoLand/licoarc.com'
          assert re.fullmatch(r'[0-9a-f]{40}',pin['revision']) and pin['revision']!='0'*40
          revision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('revision='+pin['revision']+'\nsource='+revision+'\n')
          PY
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: LicoLand/licoarc.com
          ref: ${{ steps.renderer.outputs.revision }}
          path: .docs-renderer
          persist-credentials: false
      - name: Install locked renderer tools
        run: python -m pip install -r .docs-renderer/requirements.lock
      - name: Build this protocol revision as a preview
        run: python .docs-renderer/tools/docs_build.py --source . --revision '${{ steps.renderer.outputs.source }}' --preview
      - name: Check byte-identical reconstruction
        run: python .docs-renderer/tools/check_reproducible.py --source . --revision '${{ steps.renderer.outputs.source }}' --preview
      - name: Record source and renderer commits
        run: |
          git rev-parse HEAD > .docs-renderer/site/protocol-commit.txt
          git -C .docs-renderer rev-parse HEAD > .docs-renderer/site/renderer-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protocol-documentation-preview
          path: .docs-renderer/site/
          retention-days: 14
