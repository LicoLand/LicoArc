name: Assemble reviewed Nostr V1 sources

on:
  push:
    branches: ["feature/nostr-layered-v1-20260926"]
    paths:
      - ".github/nostr-v1-patch/**"
      - ".github/workflows/assemble-nostr-v1.yml"

permissions:
  contents: read

jobs:
  assemble:
    if: github.repository == 'LicoLand/LicoArc' && github.ref == 'refs/heads/feature/nostr-layered-v1-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
      - name: Verify exact source base and apply reviewed patch
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 575c09eebd463668c9bf7c776bcfa047f50e5d25 HEAD
          git diff --quiet 575c09eebd463668c9bf7c776bcfa047f50e5d25 HEAD -- . ':(exclude).github/nostr-v1-patch/**' ':(exclude).github/workflows/assemble-nostr-v1.yml'
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.github/nostr-v1-patch/part-{i:02d}.b64').read_text().strip() for i in range(6))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 149233
          assert hashlib.sha256(patch).hexdigest() == '0ea918eedbf89f84daf0c5601c56cae9b887edcccce90d30068fa95b353006ec'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
      - name: Regenerate and verify exact definition
        run: |
          set -euo pipefail
          npm run artifacts:generate
          npm run verify
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const a = JSON.parse(readFileSync('artifacts/v1/nostr-interop.bundle.json'));
          if (a.bindingId !== '4c473b9b38b5b1f68d3c5f208bc2b92466386c05d9b39ea4a1de88b652f6f244') throw Error('binding identity differs from reviewed source');
          JS
          git diff --check
      - name: Commit verified source and generated artifacts to feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=feature/nostr-layered-v1-20260926
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_sha="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: define open Nostr interoperability and LicoArc V1 enhancements'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
