name: Documentation issue
description: Report an unclear, incorrect or missing protocol document.
title: "docs: "
body:
  - type: input
    id: source
    attributes:
      label: Page or source path
      description: Include the source revision when available.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
      description: State what you were trying to understand and the relevant section.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested clarification
